services:
  - type: web
    name: llm-token-optimizer
    runtime: python
    plan: free
    buildCommand: python -m pip install -e .
    startCommand: uvicorn allocator.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
