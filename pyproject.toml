[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allocator"
version = "0.1.0"
description = "Allocate a fixed token/dollar budget across competing LLM tasks, comparing exact DP against a greedy baseline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Standard library plus these two only — no LLM SDKs or extra frameworks.
dependencies = [
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
allocator = "allocator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
